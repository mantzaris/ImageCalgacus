   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(147.710338 59.041474)"> I have taken so few leisure minutes over our </text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(147.710338 70.350452)">many conversations as they slipped out. In </text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(147.710338 81.65943)">fact. As it. This is an experiment.</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(147.710338 92.968408)"/>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(147.710338 104.277386)">In quiet hours such are there to seize for me </text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(147.710338 115.586364)">as few moments pass with my footsteps across </text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(147.710338 126.895342)">leaf-lined earth I find no words</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(147.710338 205.28691)">Displayed excerpt ends here.</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(147.710338 214.24516)">Complete carrier: 616 tokens,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'" transform="translate(147.710338 223.20341)">2,827 UTF-8 bytes.</text>
   </g>
